services:
  postgres:
    image: postgres:16-alpine
    container_name: portal-te-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: portal
      POSTGRES_PASSWORD: portal_dev_password
      POSTGRES_DB: portal_te
    ports:
      - "5432:5432"
    volumes:
      - portal_pgdata:/var/lib/postgresql/data

volumes:
  portal_pgdata: