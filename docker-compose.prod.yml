services:
  postgres:
    image: postgres:16-alpine
    container_name: portal-te-postgres-prod
    restart: unless-stopped
    environment:
      POSTGRES_USER: portal
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: portal_te
    volumes:
      - portal_pgdata_prod:/var/lib/postgresql/data
    networks:
      - portal_te_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portal -d portal_te"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: portal-te-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env.production
    environment:
      DATABASE_URL: postgresql://portal:${POSTGRES_PASSWORD}@postgres:5432/portal_te?schema=public
      UPLOAD_DIR: /app/uploads
      NODE_ENV: production
      PORT: 8080
      HOST: 0.0.0.0
    ports:
      - "8080:8080"
    volumes:
      - portal_uploads_prod:/app/uploads
    networks:
      - portal_te_network

volumes:
  portal_pgdata_prod:
  portal_uploads_prod:

networks:
  portal_te_network:
    driver: bridge